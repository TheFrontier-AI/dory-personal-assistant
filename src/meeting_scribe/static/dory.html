<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dory · The AI coworker that remembers, files and follows up</title>
<meta name="description" content="Dory is an AI coworker who lives in your team's Discord: meeting notes, receipts, task follow-up and answers from your company's own documents, in Thai or English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<link rel="icon" type="image/svg+xml" href="/static/dory/dory-mark.svg">
<link rel="icon" type="image/png" href="/static/dory/favicon.png">
<link rel="stylesheet" href="/static/dory/theme.css">
<style>
  /* Lantern Deep homepage: the page descends from the abyss (hero) through lighter blues and
     surfaces into the light Sand theme at the final call to action. Text always sits on solid
     colour. Page-specific rules only; tokens come from theme.css. */
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body { background: var(--ocean-950); }
  .skip { position: absolute; left: 16px; top: -80px; z-index: 50; padding: 10px 16px; border-radius: 10px; background: var(--ocean-50);
    color: var(--ocean-950); font-weight: 600; text-decoration: none; }
  .skip:focus { top: 12px; }

  /* ---------- navigation (deep, transparent over the hero, solid once scrolled) ---------- */
  .nav { background: transparent; border-bottom: 1px solid transparent; transition: background var(--dur-base), border-color var(--dur-base); }
  .nav.scrolled { background: rgba(5, 11, 31, .9); border-bottom-color: var(--color-border); }
  .nav .wrap { gap: 10px; }
  .logo { color: var(--color-text); }
  .logo:hover { color: var(--color-text); }
  .links { display: flex; gap: 2px; margin-left: auto; }
  .links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; color: var(--color-text-muted);
    text-decoration: none; font-weight: 500; font-size: 15px; }
  .links a:hover { color: var(--color-text); background: rgba(234, 242, 255, .06); }
  .links .only-m { display: none; }
  .menu-btn { display: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--color-border-control); background: transparent; }
  .menu-btn span { display: block; width: 18px; height: 2px; margin: 4px auto; border-radius: 2px; background: var(--color-text); }
  @media (max-width: 960px) {
    .links { display: none; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; padding: 8px 16px 16px;
      background: var(--ocean-900); border-bottom: 1px solid var(--color-border); }
    .links.open { display: flex; }
    .links .only-m { display: inline-flex; }
    .nav .login { display: none; }
    .menu-btn { display: block; }
    .langsw { margin-left: auto; }
  }
  @media (max-width: 600px) { .nav .cta-top { display: none; } }

  /* ---------- hero: the abyss, three depth planes, Dory ---------- */
  .hero { position: relative; overflow: hidden; margin-top: -64px; padding: 112px 0 88px; min-height: 88svh; display: flex; align-items: center;
    background: radial-gradient(110% 80% at 72% 0%, #0E1D45 0%, var(--ocean-950) 62%); --cap: 60; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 140px; z-index: 1; pointer-events: none;
    background: linear-gradient(rgba(10, 21, 48, 0), var(--ocean-900)); }
  .hero .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; }
  .copy { display: flex; flex-direction: column; gap: 20px; max-width: 560px; }
  .eyebrow { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--glow-300); }
  :lang(th) .eyebrow { font-family: var(--font); font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none; }
  .hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 5vw, 60px); line-height: 1.08; letter-spacing: -.015em; }
  :lang(th) .hero h1 { line-height: 1.3; letter-spacing: 0; }
  .sub { font-size: 18px; color: var(--color-text-muted); max-width: 52ch; }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .aside-line { font-size: 15px; color: var(--color-text-muted); }
  .free { font-size: 14px; color: var(--color-text-subtle); }
  .stage { position: relative; width: min(100%, 480px); aspect-ratio: 1; justify-self: center; }
  .stage::before { content: ""; position: absolute; inset: 6% 4%; border-radius: 50%; filter: blur(24px);
    background: radial-gradient(closest-side, rgba(95, 242, 224, .2), rgba(185, 180, 242, .12) 60%, rgba(5, 11, 31, 0)); }
  .tilt { position: absolute; inset: 0; transform: rotate(calc(var(--tilt, 0) * 1deg)); transform-origin: 60% 55%; }
  .fish-float { width: 100%; height: 100%; animation: dory-float 6s var(--ease-in-out) infinite; }
  .hero-pic { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 40px;
    border: 1px solid rgba(163, 183, 221, .22); box-shadow: 0 28px 70px rgba(0, 0, 0, .5); }
  @keyframes dory-float { 50% { transform: translateY(-8px); } }
  .sea { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .plane { position: absolute; inset: -40px;
    transform: translate3d(calc(var(--px, 0) * var(--m) * -1px), calc(var(--py, 0) * var(--m) * -1px + min(var(--sy, 0) * var(--k), var(--cap)) * 1px), 0); }
  .far { --m: 4; --k: .1; } .mid { --m: 10; --k: .2; } .near { --m: 18; --k: .4; }
  .kelp { position: absolute; left: 0; right: 0; bottom: 40px; width: 100%; height: 34%; }
  .kelp .bed { fill: var(--ocean-900); } .kelp .weed { stroke: var(--ocean-800); fill: none; stroke-width: 9; stroke-linecap: round; }
  .ray { position: absolute; top: -20%; height: 130%; width: 140px; transform: rotate(22deg); transform-origin: top;
    background: linear-gradient(180deg, rgba(95, 242, 224, .16), rgba(95, 242, 224, 0) 72%); filter: blur(10px);
    animation: ray-breathe 9s var(--ease-in-out) infinite; }
  .r1 { left: 14%; } .r2 { left: 36%; width: 70px; animation-delay: -3s; } .r3 { left: 64%; width: 190px; opacity: .6; animation-delay: -6s; }
  @keyframes ray-breathe { 50% { opacity: .45; } }
  .speck { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; background: var(--ocean-50);
    opacity: 0; animation: drift var(--d) linear var(--dl) infinite; }
  @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 15%, 85% { opacity: var(--o); } 100% { transform: translateY(-140px); opacity: 0; } }
  .pause { position: absolute; right: 16px; bottom: 16px; z-index: 3; }
  .hero.asleep * { animation-play-state: paused !important; }
  .motion-off .hero *, .motion-off .speck { animation: none !important; }
  .motion-off .speck { opacity: var(--o); }
  @media (max-width: 900px) {
    .hero { min-height: 0; padding: 104px 0 80px; }
    .hero .wrap { grid-template-columns: minmax(0, 1fr); }
    .stage { width: min(100%, 320px); }
  }
  @media (max-width: 700px) { .hero { --cap: 24; } }

  /* ---------- sections ---------- */
  .sec { position: relative; padding: 112px 16px; }
  .sec > .wrap { width: min(1120px, 100%); } /* the section owns the 16px gutter */
  .sec-h { max-width: 660px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
  .sec-h h2, .final h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 3vw, 34px); line-height: 1.2; }
  :lang(th) .sec-h h2, :lang(th) .final h2 { line-height: 1.35; }
  .sec-h p { color: var(--color-text-muted); font-size: 17px; }
  @media (max-width: 700px) { .sec { padding: 72px 16px; } }
  .js .reveal { opacity: 0; transform: translateY(12px); transition: opacity 320ms var(--ease-out-soft), transform 320ms var(--ease-out-soft); }
  .js .reveal.in { opacity: 1; transform: none; }
  .motion-off .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }

  /* "Meet Dory": the introduction video (native controls, nothing loads before Play) */
  .meet { background: linear-gradient(180deg, var(--ocean-900), var(--ocean-950)); padding-bottom: 64px; }
  .film { margin: 0; }
  .film video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: var(--radius-xl); background: var(--ocean-900);
    border: 1px solid rgba(163, 183, 221, .22); box-shadow: 0 28px 70px rgba(0, 0, 0, .5); }
  .film figcaption { margin-top: 12px; font-size: 14px; color: var(--color-text-muted); }

  /* "See Dory at work": example conversations in a light chat card */
  #preview { background: var(--ocean-900); }
  .pv { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; }
  .tabs { display: flex; flex-direction: column; gap: 6px; }
  .tab { min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid transparent; background: transparent; text-align: left;
    color: var(--color-text-muted); font-weight: 600; font-size: 15px; }
  .tab:hover { color: var(--color-text); background: rgba(234, 242, 255, .04); }
  .tab[aria-selected="true"] { color: var(--color-text); background: var(--ocean-800); border-color: var(--color-border); box-shadow: inset 3px 0 0 var(--glow-300); }
  .chat { border-radius: var(--radius-xl); overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); }
  .chat-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--color-bg-raised); border-bottom: 1px solid var(--color-border); }
  .chat-h .mark, .m-dory .mark { border-radius: 50%; }
  .chat-h strong { font-size: 15px; display: block; line-height: 1.2; }
  .chat-h small { font-size: 13px; color: var(--color-text-muted); }
  .chat-b { display: flex; flex-direction: column; gap: 16px; min-height: 340px; padding: 22px 18px 24px; }
  .m-user { align-self: flex-end; max-width: 80%; padding: 10px 14px; border-radius: 18px 18px 6px 18px; background: var(--bubble-user-bg);
    color: var(--bubble-user-text); font-size: 15px; }
  .m-dory { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; font-size: 15px; }
  .m-dory .who { display: block; font-size: 13px; font-weight: 600; color: var(--color-text-muted); }
  .m-dory ol { margin: 6px 0 0; padding-left: 20px; }
  .att { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, .14);
    font-size: 13px; }
  .att svg { width: 14px; height: 14px; }
  /* not yet "said": out of the layout but still read by screen readers, so the example is complete for them */
  .step.pending { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .step.shown { animation: msg-in var(--dur-base) var(--ease-out-soft); }
  @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
  .motion-off .step.shown { animation: none; }
  .think { color: var(--color-text-muted); font-size: 14px; align-items: center; }
  .pv-note { margin-top: 2px; font-size: 13px; color: var(--color-text-muted); }
  .pv-ctl { display: flex; gap: 8px; margin-top: 14px; }
  .pv-ctl .btn[disabled] { opacity: .45; background: transparent; color: var(--color-text); border-color: var(--color-border-control); }
  @media (max-width: 860px) {
    .pv { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .tabs { flex-direction: row; flex-wrap: wrap; }
    .tab { flex: 1 1 auto; text-align: center; }
    .tab[aria-selected="true"] { box-shadow: inset 0 -3px 0 var(--glow-300); }
  }

  /* capabilities */
  #features { background: linear-gradient(180deg, var(--ocean-900), var(--ocean-800)); }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1040px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 22px; transition: transform var(--dur-base) var(--ease), border-color var(--dur-base); }
  [data-theme="deep"] .card { background: rgba(26, 47, 92, .45); }
  .card.feat:hover { transform: translateY(-2px); border-color: rgba(95, 242, 224, .35); }
  .card h3 { font-size: 17px; }
  .card p { color: var(--color-text-muted); font-size: 15px; }
  /* the icon sits beside its heading, in flow, with no tile of its own; the rest of the card spans the width */
  .card:has(> .ic) { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; align-content: start; column-gap: 12px; row-gap: 10px; }
  .card:has(> .ic) > :not(.ic):not(h3) { grid-column: 1 / -1; }
  .ic { display: grid; place-items: center; color: var(--glow-300); }
  .ic svg { width: 24px; height: 24px; }
  .card .pill { align-self: flex-start; }

  /* how it works */
  #how { background: var(--ocean-800); }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; position: relative; }
  .steps::before { content: ""; position: absolute; left: 22px; right: 22px; top: 22px; height: 1px;
    background: linear-gradient(90deg, rgba(95, 242, 224, .5), rgba(185, 180, 242, .3)); }
  .stp { position: relative; display: flex; flex-direction: column; gap: 10px; }
  .stp .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--ocean-950);
    background: var(--glow-300); }
  .stp p { color: var(--color-text-muted); }
  .stp code, .roles code { font-family: var(--mono); font-size: 14px; padding: 2px 8px; border-radius: 6px; background: rgba(95, 242, 224, .12); color: var(--glow-300); }
  .where { margin-top: 64px; }
  .where h3 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin-bottom: 4px; }
  .where > p { color: var(--color-text-muted); margin-bottom: 20px; }
  @media (max-width: 760px) {
    .steps { grid-template-columns: minmax(0, 1fr); }
    .steps::before { left: 22px; right: auto; top: 22px; bottom: 22px; width: 1px; height: auto; }
    .stp { padding-left: 60px; } .stp .n { position: absolute; left: 0; top: 0; }
  }

  /* use cases by role */
  #roles { background: linear-gradient(180deg, var(--ocean-800), #142650); }
  .tabs.row { flex-direction: row; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs.row .tab { border-radius: 99px; padding: 10px 18px; }
  .tabs.row .tab[aria-selected="true"] { box-shadow: inset 0 0 0 1px var(--glow-300); }
  .role { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; padding: 28px; border-radius: var(--radius-xl);
    background: var(--ocean-900); border: 1px solid var(--color-border); }
  .role .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--glow-300); margin-bottom: 6px; }
  .role q { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.35; }
  .role p { color: var(--color-text-muted); font-size: 16px; }
  @media (max-width: 760px) { .role { grid-template-columns: minmax(0, 1fr); padding: 22px; } .role q { font-size: 19px; } }

  /* trust and control */
  #trust { background: linear-gradient(180deg, #142650, var(--ocean-700)); }
  .trust { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 48px; align-items: start; }
  .flow { display: flex; flex-direction: column; align-items: flex-start; gap: 0; margin-top: 8px; }
  .flow span { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--color-border-control); background: var(--ocean-800); font-weight: 600; font-size: 15px; }
  .flow span:last-child { border-color: var(--glow-300); }
  .flow i { display: block; width: 1px; height: 22px; margin-left: 28px; background: var(--ocean-300); }
  .facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px; }
  .facts li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; font-size: 16px; }
  .facts svg { width: 22px; height: 22px; color: var(--glow-300); margin-top: 2px; }
  .facts b { font-weight: 600; } .facts span { color: var(--color-text-muted); }
  .models { margin-top: 24px; padding: 14px 16px; border-radius: 12px; background: var(--ocean-800); color: var(--color-text-muted); font-size: 14px; }
  .models code { font-family: var(--mono); color: var(--color-text); overflow-wrap: anywhere; }
  @media (max-width: 860px) { .trust { grid-template-columns: minmax(0, 1fr); gap: 32px; } }

  /* plans */
  #plans { background: var(--ocean-700); }
  #plans .grid { grid-template-columns: repeat(2, minmax(0, 360px)); }
  @media (max-width: 760px) { #plans .grid { grid-template-columns: minmax(0, 1fr); } }
  .price { font-weight: 600; color: var(--color-text); }
  .plan-c.soon { border-style: dashed; background: transparent; box-shadow: none; }
  .plan-c .btn { margin-top: auto; align-self: flex-start; }
  .fine { margin-top: 18px; font-size: 14px; color: var(--color-text-muted); max-width: 720px; }

  /* final call to action: Dory surfaces into the light */
  .final { padding: 40px 0 96px; text-align: center;
    background: linear-gradient(180deg, var(--ocean-700) 0, #4F6A9B 90px, #C9D3E4 180px, var(--sand-50) 250px); }
  .final .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .surface-fish { display: block; width: 160px; margin-bottom: 40px; }
  .surface-fish img { display: block; width: 100%; height: auto; border-radius: 32px; box-shadow: 0 18px 44px rgba(0, 0, 0, .35); }
  .js .surface-fish.reveal { transform: translateY(48px); transition: opacity 600ms var(--ease-out-soft), transform 900ms var(--ease-buoy); }
  .final > .wrap > p { color: var(--color-text-muted); font-size: 17px; max-width: 520px; }
  .final .ctas { justify-content: center; }
  .entry { width: 100%; margin-top: 56px; text-align: left; }
  .entry h3.t { font-family: var(--font-display); font-weight: 600; font-size: 22px; text-align: center; }
  .entry > p { color: var(--color-text-muted); text-align: center; margin: 6px 0 24px; }
  .entry .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 860px) { .entry .grid { grid-template-columns: minmax(0, 1fr); } }
  .card.go { text-decoration: none; color: inherit; }
  .card.go:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .card.go { grid-template-rows: auto 1fr auto; }
  .card.go .ic { color: var(--glow-700); }
  .card.go .more { margin-top: auto; padding-top: 10px; color: var(--color-link); font-size: 15px; }

  /* footer */
  .foot { background: var(--sand-100); border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--color-text-muted); font-size: 14px; }
  .foot .wrap { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center; }
  .foot a { color: var(--color-text-muted); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
  .foot a:hover { color: var(--indigo); text-decoration: underline; }
  .foot .btn { margin-left: auto; }
  .foot .btn + .btn { margin-left: 0; }
  @media (max-width: 600px) { .foot .btn { margin-left: 0; } }
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>

<header class="nav" id="nav" data-theme="deep">
  <div class="wrap">
    <a class="logo" href="#main" aria-label="Dory"><span class="mark" aria-hidden="true">D</span><span data-i18n="brand"></span></a>
    <nav class="links" id="links" data-i18n-attr="aria-label:nav_aria">
      <a href="#features" data-i18n="nav_features"></a>
      <a href="#how" data-i18n="nav_how"></a>
      <a href="#trust" data-i18n="nav_trust"></a>
      <a href="#plans" data-i18n="nav_plans"></a>
      <a class="only-m" href="/center" data-i18n="nav_login"></a>
    </nav>
    <div class="langsw" role="group" data-i18n-attr="aria-label:lang_switch_aria">
      <button type="button" data-lang="th" data-i18n="lang_th"></button>
      <button type="button" data-lang="en" data-i18n="lang_en"></button>
    </div>
    <a class="btn ghost small login" href="/center" data-i18n="nav_login"></a>
    <a class="btn primary small cta-top" href="__DORY_INVITE_URL__" data-invite data-i18n="cta_add_short"></a>
    <a class="btn primary small cta-top" href="/start" data-invite-fallback hidden data-i18n="cta_create"></a>
    <button type="button" class="menu-btn" id="menu" aria-expanded="false" aria-controls="links" data-i18n-attr="aria-label:menu_aria"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="main" tabindex="-1">
  <section class="hero" id="hero" data-theme="deep">
    <div class="sea" aria-hidden="true">
      <div class="plane far">
        <svg class="kelp" viewBox="0 0 1200 240" preserveAspectRatio="none" focusable="false"><path class="bed" d="M0 240V172C80 152 140 192 220 177C320 158 380 122 470 142C560 162 620 202 720 188C820 174 880 132 980 144C1080 156 1140 192 1200 182V240Z"/><path class="weed" d="M96 236C102 196 74 166 88 128C102 90 80 66 92 34"/><path class="weed" d="M132 238C126 206 150 180 138 146"/><path class="weed" d="M1018 236C1010 198 1040 170 1026 130C1014 96 1036 74 1028 44"/><path class="weed" d="M1072 238C1080 210 1058 188 1068 160"/></svg>
      </div>
      <div class="plane mid"><span class="ray r1"></span><span class="ray r2"></span><span class="ray r3"></span></div>
      <div class="plane near" id="specks"></div>
    </div>
    <div class="wrap">
      <div class="copy">

  "sub": {"th": "ดอรี่อยู่ในแชตของทีมคุณ จดประชุม ลงบัญชีใบเสร็จ ตามงาน และตอบคำถามจากเอกสารของบริษัทคุณเอง ได้ทั้งภาษาไทยและอังกฤษ", "en": "Dory lives in your team's chat. She takes meeting notes, logs receipts, follows up on tasks and answers from your company's own documents, in Thai or English."},

  "pv1_d2": {"th": "<b>สรุปประชุม · Stand-up</b><br>มติ: เริ่มโปรโมชันปลายปีวันที่ 1 ธ.ค.<br>งาน: สมชาย ทำรายการราคา ส่งวันศุกร์ · มะลิ ร่างโปสเตอร์ ส่งวันพุธ<br>ส่งการ์ดให้แต่ละคนกดยืนยันงานแล้วค่ะ", "en": "<b>Minutes · Stand-up</b><br>Decision: the year-end promotion starts on 1 Dec.<br>Tasks: Somchai, price list, due Friday · Mali, poster draft, due Wednesday.<br>I've sent each owner a card to confirm their task."},

  "pv2_u": {"th": "ค่าอุปกรณ์สำนักงานสำหรับโต๊ะใหม่", "en": "Office supplies for the new desks"},
  "pv2_d": {"th": "บันทึกลงบัญชีแล้วค่ะ: <b>Office Mate</b> · 1,250.00 บาท · อุปกรณ์สำนักงาน · 24 ต.ค. ถ้ามีคนส่งใบเดิมซ้ำ ดอรี่จะข้ามให้ค่ะ", "en": "Saved to the ledger: <b>Office Mate</b> · 1,250.00 THB · Office supplies · 24 Oct. If someone sends the same receipt again, I'll skip it."},
  "pv3_u": {"th": "ตั้งแต่วันศุกร์ฉันพลาดอะไรไปบ้าง", "en": "What did I miss since Friday?"},
  "pv3_d": {"th": "ตั้งแต่วันศุกร์มี 3 เรื่องค่ะ<ol><li>ประชุมงบประมาณย้ายไปวันพฤหัสบดี 14:00</li><li>สมชายมอบงาน “สไลด์ไตรมาส 4” ให้คุณ กำหนดส่งวันพุธ</li><li>มีคำขอเบิกค่าใช้จ่าย 2 รายการรอคุณอนุมัติ</li></ol>", "en": "Three things since Friday:<ol><li>The budget meeting moved to Thursday at 14:00.</li><li>Somchai assigned you “Q4 deck”, due Wednesday.</li><li>Two expense requests are waiting for your approval.</li></ol>"},
  "pv4_u": {"th": "เดือนนี้ค่าการตลาดไปเท่าไรแล้ว", "en": "เดือนนี้ค่าการตลาดไปเท่าไรแล้ว"},
  "pv4_d": {"th": "เดือนตุลาคมใช้ไปกับการตลาด 18,400 บาท จากใบเสร็จ 6 ใบค่ะ ก้อนใหญ่สุดคือค่าโฆษณาออนไลน์ 9,800 บาท", "en": "เดือนตุลาคมใช้ไปกับการตลาด 18,400 บาท จากใบเสร็จ 6 ใบค่ะ ก้อนใหญ่สุดคือค่าโฆษณาออนไลน์ 9,800 บาท"},
  "pv4_note": {"th": "ดอรี่ตอบเป็นภาษาหลักที่บริษัทเลือก ทีมในตัวอย่างนี้เลือกภาษาไทย", "en": "“How much have we spent on marketing this month?” Dory replies in the language the company chose; this example team chose Thai."},
  "ft_h": {"th": "ความสามารถที่ใช้ได้จริงวันนี้", "en": "What Dory can do today"},
  "ft_p": {"th": "ทุกข้อด้านล่างมีอยู่ในดอรี่เวอร์ชันปัจจุบัน และผู้ดูแลเปิดปิดได้ทีละข้อจากศูนย์บัญชาการ", "en": "Everything below is in the current build, and admins can switch each one on or off from the command center."},
  "f1_t": {"th": "ประชุมเสียง", "en": "Voice meetings"},
  "f1_d": {"th": "เข้าห้องเสียงเมื่อถูกเชิญ ถอดเสียงทีละช่วง ตอบเมื่อถูกเรียกชื่อ และสรุปมติพร้อม action item ตอนจบ", "en": "Joins the voice room when invited, transcribes as it goes, answers when called by name, and posts decisions and action items at the end."},
  "f2_t": {"th": "ใบเสร็จและค่าใช้จ่าย", "en": "Receipts and expenses"},
  "f2_d": {"th": "อ่านรูปใบเสร็จและ PDF ลงบัญชี ตัดใบซ้ำ และให้ผู้บริหารถามยอดค่าใช้จ่ายเป็นภาษาคน", "en": "Reads receipt photos and PDFs into a ledger, drops duplicates, and lets executives ask about spending in plain language."},
  "f3_t": {"th": "ติดตามงานและรายงาน", "en": "Task follow-up and reports"},
  "f3_d": {"th": "เปลี่ยน action item เป็นงาน ตามความคืบหน้าทาง DM และส่งรายงานตอนเย็นให้ผู้บริหาร", "en": "Turns action items into tasks, follows up by DM, and sends executives an evening report."},
  "f4_t": {"th": "เอกสารและ wiki", "en": "Documents and wiki"},
  "f4_d": {"th": "จำไฟล์ที่ทีมส่ง สร้างหน้า wiki ของบริษัท และตอบจากเอกสารตามสิทธิ์ที่แต่ละคนเห็นได้", "en": "Remembers files the team shares, keeps a company wiki, and answers from documents each person is allowed to see."},
  "f5_t": {"th": "สรุปเช้าเย็นและตามทัน", "en": "Briefs and catch-up"},
  "f5_d": {"th": "สรุปประจำวันส่วนตัวทาง DM และ \"พลาดอะไรไปบ้าง\" หลังหายไปทั้งวัน", "en": "A personal morning and evening brief by DM, and \"what did I miss?\" after a day away."},
  "f6_t": {"th": "ขออนุมัติ โพลล์ และฟอร์ม", "en": "Approvals, polls and forms"},
  "f6_d": {"th": "ขอเบิก ขอลา ขอซื้อ โหวต และแบบสอบถามทาง DM โดยไม่ต้องออกจาก Discord", "en": "Expense, leave and purchase requests, votes and DM surveys, all without leaving Discord."},
  "f7_t": {"th": "ค้นหาและวิจัย", "en": "Search and research"},
  "f7_d": {"th": "ค้นทุกแหล่งของทีมพร้อมกัน ค้นเว็บพร้อมอ้างอิง และทำรายงานวิจัยเชิงลึกเป็น PDF", "en": "Searches every team source at once, searches the web with citations, and writes deep-research reports as PDF."},
  "f8_t": {"th": "เรียนรู้บริษัทของคุณ", "en": "Learns your company"},
  "f8_d": {"th": "สอนศัพท์เฉพาะ SOP และ FAQ ให้ดอรี่ พร้อม domain pack สำเร็จรูป 14 สาขา", "en": "Teach Dory your glossary, SOPs and FAQ, with 14 ready-made industry packs."},
  "ex_h": {"th": "เริ่มใช้ได้ใน 3 ขั้นตอน", "en": "Up and running in three steps"},
  "ex_p": {"th": "ดอรี่ทำงานอยู่ใน Discord ของทีมคุณ ไม่ต้องติดตั้งแอปใหม่ ไม่ต้องย้ายข้อมูล", "en": "Dory lives inside your team's Discord. No new app to install, no data to migrate."},
  "ex1_t": {"th": "เพิ่มดอรี่เข้าเซิร์ฟเวอร์", "en": "Add Dory to your server"},
  "ex1_d": {"th": "กดปุ่มเชิญแล้วเลือกเซิร์ฟเวอร์ ดอรี่จะสร้างห้องคุยส่วนตัวให้สมาชิกเอง", "en": "Use the invite button and pick a server. Dory creates a private chat channel for each member."},
  "ex2_t": {"th": "พิมพ์ /ตั้งค่า หรือเรียกชื่อ", "en": "Type /setup or just say her name"},
  "ex2_d": {"th": "พิมพ์ <code>/ตั้งค่า</code> เพื่อเปิดศูนย์บัญชาการ หรือพิมพ์ <code>@Dory</code> แล้วถามได้เลย", "en": "Type <code>/setup</code> to open the command center, or mention <code>@Dory</code> and ask away."},
  "ex3_t": {"th": "ปล่อยให้ดอรี่ทำงาน", "en": "Let Dory work"},
  "ex3_d": {"th": "ส่งใบเสร็จ เชิญเข้าประชุม หรือถามเรื่องค่าใช้จ่าย ดอรี่ตอบเป็นภาษาหลักของบริษัท", "en": "Send a receipt, invite her to a meeting, or ask about expenses. Dory answers in your company's language."},
  "pf_h": {"th": "ดอรี่อยู่ตรงไหนบ้าง", "en": "Where Dory works"},
  "pf_p": {"th": "เราให้บริการสองส่วน: บอตดอรี่ในแพลตฟอร์มที่ทีมคุยกันอยู่แล้ว และแพลตฟอร์มเว็บสำหรับดูแลองค์กร", "en": "Two parts: the Dory bot inside the platforms your team already talks on, and a web platform to run the organization."},
  "pf_now": {"th": "ใช้ได้แล้ว", "en": "Available now"},
  "pf_org": {"th": "สำหรับองค์กร", "en": "For organizations"},
  "pf1_t": {"th": "บอตใน Discord", "en": "Bot in Discord"},
  "pf1_d": {"th": "เพิ่มเข้าเซิร์ฟเวอร์แล้วใช้ได้ทันที ใบเสร็จ ประชุมเสียง ตามงาน ถามตอบ ทุกอย่างอยู่ในห้องที่ทีมใช้อยู่", "en": "Add it to a server and it works at once: receipts, voice meetings, follow-ups and Q&A, all in the channels your team already uses."},
  "pf2_t": {"th": "แพลตฟอร์มเว็บ", "en": "Web platform"},
  "pf2_d": {"th": "ศูนย์ควบคุมองค์กร: สมาชิก คลังเอกสาร งาน แพ็กเกจ และคุยกับดอรี่จากเบราว์เซอร์ ล็อกอินด้วย Google", "en": "The organization center: members, document library, tasks, plan, and chat with Dory from the browser. Sign in with Google."},
  "pf3_t": {"th": "Google Meet", "en": "Google Meet"},
  "pf3_d": {"th": "เครื่องอัดประชุมเปิดคู่กับ Meet ถอดเสียงไทยสด สรุปมติและงานส่งเข้า Discord", "en": "A recorder that runs beside Meet: live Thai transcript, then decisions and action items posted to Discord."},
  "pf4_t": {"th": "Slack และ ClickUp", "en": "Slack and ClickUp"},
  "pf4_d": {"th": "เชื่อมต่อผ่านศูนย์ควบคุมองค์กร เปิดให้ตามคำขอ ติดต่อเราเพื่อเปิดใช้", "en": "Connected through the organization center, switched on by request. Contact us to enable it."},
  "ro_h": {"th": "แต่ละตำแหน่งถามดอรี่อย่างไร", "en": "What each role asks Dory"},
  "ro_p": {"th": "ตัวอย่างคำถาม แต่ละคนได้คำตอบจากข้อมูลที่ตัวเองมีสิทธิ์เห็นเท่านั้น", "en": "Example asks. Each person gets answers only from what they are allowed to see."},
  "ro_tabs_aria": {"th": "ตำแหน่ง", "en": "Roles"},
  "ro_t1": {"th": "เจ้าของกิจการ", "en": "Owner"},
  "ro_t2": {"th": "ผู้จัดการ", "en": "Manager"},
  "ro_t3": {"th": "สมาชิกทีม", "en": "Team member"},
  "ro_t4": {"th": "การเงิน", "en": "Finance"},
  "ro_ask": {"th": "ถามว่า", "en": "They ask"},
  "ro_get": {"th": "ดอรี่ตอบด้วย", "en": "Dory returns"},
  "ro1_q": {"th": "สรุปค่าใช้จ่ายสัปดาห์นี้แยกตามหมวดให้หน่อย", "en": "Summarise this week's spending by category."},
  "ro1_a": {"th": "ตารางยอดตามหมวด ร้านที่จ่ายมากที่สุด และสไลด์สรุปถ้าคุณขอ", "en": "A table by category, the biggest vendors, and a slide deck if you ask for one."},
  "ro2_q": {"th": "โปรเจกต์เปิดตัวมีงานไหนเลยกำหนดบ้าง", "en": "What's overdue on the launch project?"},
  "ro2_a": {"th": "งานที่เลยกำหนดพร้อมผู้รับผิดชอบ และภาพความคืบหน้าเทียบกับเวลาที่เหลือ", "en": "Overdue tasks with their owners, and a picture of progress against the time left."},
  "ro3_q": {"th": "เตือนฉันทุกวันจันทร์ 9 โมงให้ส่งรายงานยอดขาย", "en": "Remind me every Monday at 9 to send the sales report."},
  "ro3_a": {"th": "การเตือนซ้ำทุกสัปดาห์ ส่งเข้าห้องส่วนตัวของคุณกับดอรี่", "en": "A weekly reminder, delivered to your private Dory channel."},
  "ro4_q": {"th": "รวมยอดในไฟล์ Excel นี้ตามผู้ขายให้หน่อย", "en": "Total this spreadsheet by vendor."},
  "ro4_a": {"th": "ตารางยอดตามผู้ขายและกราฟ จากไฟล์ที่คุณแนบมา", "en": "A table by vendor and a chart, worked out from the file you attached."},
  "tm_h": {"th": "สร้างมาเพื่อองค์กรตั้งแต่วันแรก", "en": "Built for organizations from day one"},
  "tm_p": {"th": "เซิร์ฟเวอร์แต่ละแห่งคือผู้เช่าแยกกัน ข้อมูลไม่ปะปน และสิทธิ์การเห็นข้อมูลเดินตามโครงสร้างของทีมบน Discord", "en": "Every server is its own tenant. Data never mixes, and who sees what follows your team's Discord structure."},
  "flow_aria": {"th": "ดอรี่ตอบจากห้องแชตให้เฉพาะคนที่อ่านห้องนั้นได้", "en": "Dory answers from a channel only for people who can read it"},
  "flow1": {"th": "เซิร์ฟเวอร์ของคุณ", "en": "Your server"},
  "flow2": {"th": "ห้องแชตในเซิร์ฟเวอร์", "en": "Its channels"},
  "flow3": {"th": "เฉพาะคนที่อ่านห้องนั้นได้", "en": "Only people who can read them"},
  "tm1_t": {"th": "แยกข้อมูลต่อเซิร์ฟเวอร์", "en": "Isolated per server."},
  "tm1_d": {"th": "บัญชี ความจำ เอกสาร และการตั้งค่าทั้งหมดผูกกับเซิร์ฟเวอร์ของคุณเท่านั้น", "en": "Ledger, memory, documents and settings belong to your server alone."},
  "tm2_t": {"th": "สิทธิ์ตามห้องและตำแหน่ง", "en": "Permissions follow channels and roles."},
  "tm2_d": {"th": "ดอรี่ตอบจากข้อมูลที่ผู้ถามเห็นได้อยู่แล้วเท่านั้น และผู้บริหารกำหนดได้ว่าใครคือผู้บริหาร", "en": "Dory only answers from what the asker can already read, and you decide who counts as an executive."},
  "tm3_t": {"th": "ภาษาหลักของบริษัท และภาษาของคุณเอง", "en": "One company language, plus your own."},
  "tm3_d": {"th": "บริษัทเลือกภาษาที่ดอรี่ใช้ และแต่ละคนเพิ่มภาษาส่วนตัวได้", "en": "The company picks the language Dory uses, and each person can add a personal language."},
  "tm4_t": {"th": "ศูนย์บัญชาการบนเว็บ", "en": "A web command center."},
  "tm4_d": {"th": "ล็อกอินด้วย Google เพื่อเปิดปิดความสามารถ เลือกห้อง และดูกิจกรรมล่าสุดของแต่ละเซิร์ฟเวอร์", "en": "Sign in with Google to switch features, pick channels and review each server's recent activity."},
  "tm5_t": {"th": "ทุกความสามารถมีสวิตช์", "en": "Every feature has a switch."},
  "tm5_d": {"th": "ผู้ดูแลเปิดหรือปิดแต่ละความสามารถได้จากศูนย์บัญชาการ", "en": "Admins turn each feature on or off from the command center."},
  "tm6_t": {"th": "บริษัทเป็นผู้กำหนดว่าจะเก็บอะไร", "en": "Your company decides what is kept."},
  "tm6_d": {"th": "ความจำของทีมเก็บไว้เป็นข้อมูลของบริษัทโดยค่าเริ่มต้น และผู้ดูแลตั้งให้ลบเมื่อครบจำนวนวันที่กำหนดได้", "en": "Team memory is kept as the company's record by default, and an admin can set it to delete after a chosen number of days."},
  "models_label": {"th": "โมเดล AI ที่ดอรี่ใช้อยู่ตอนนี้:", "en": "AI models running Dory right now:"},
  "pr_h": {"th": "แพ็กเกจ", "en": "Plans"},
  "pr_p": {"th": "ช่วงเปิดตัวมีแพ็กเกจเดียว ใช้ฟรีทุกความสามารถโดยไม่มีลิมิต", "en": "During launch there is one plan: every feature, free, with no limits."},
  "p_rec": {"th": "แนะนำ", "en": "Recommended"},
  "pl_trial": {"th": "ทดลองใช้งาน", "en": "Trial"},
  "pl_trial_price": {"th": "ฟรี ไม่จำกัดเวลา", "en": "Free, no time limit"},
  "pl_trial_d": {"th": "ทุกความสามารถ ไม่จำกัดจำนวนคน ไม่ต้องใช้บัตรเครดิต ตลอดช่วงเปิดตัว", "en": "Every feature, unlimited seats, no credit card, for the whole launch period."},
  "pl_more": {"th": "แพ็กเกจอื่น", "en": "More plans"},
  "pl_more_price": {"th": "เร็ว ๆ นี้", "en": "Coming soon"},
  "pl_more_d": {"th": "แพ็กเกจสำหรับทีมและองค์กรจะประกาศหลังช่วงเปิดตัว ผู้ใช้ช่วงทดลองจะได้รับแจ้งก่อน", "en": "Team and organization plans will be announced after launch. Trial users hear first."},
  "pl_start": {"th": "เริ่มทดลองใช้", "en": "Start the trial"},
  "pr_note": {"th": "ยังไม่มีการเก็บค่าบริการและไม่มีการชำระเงินในระบบ การสมัครไม่มีค่าใช้จ่ายใด ๆ", "en": "Nothing is charged and there is no payment in the system. Signing up is completely free."},
  "fin_h": {"th": "พาดอรี่ไปช่วยทีมของคุณ", "en": "Bring Dory to your team."},
  "fin_p": {"th": "เพิ่มดอรี่เข้าเซิร์ฟเวอร์ แล้วพิมพ์ @Dory เพื่อเริ่มคุยได้ทันที", "en": "Add her to your server, then mention @Dory to start right away."},
  "en_h": {"th": "เลือกทางเข้าของคุณ", "en": "Choose your way in"},
  "en_p": {"th": "ดอรี่มีสามบริการ แต่ละแบบเหมาะกับการใช้งานต่างกัน เลือกที่ตรงกับคุณได้เลย", "en": "Dory offers three services for different ways of working. Pick the one that fits you."},
  "en1_t": {"th": "ทีมเล็กและร้านค้า", "en": "Small teams and shops"},
  "en1_d": {"th": "สร้างบัญชีด้วย Google เลือกทดลองใช้ฟรี แล้วเพิ่มดอรี่เข้า Discord ของทีม ใช้ได้ทันทีโดยไม่ต้องตั้งค่า", "en": "Create an account with Google, pick the free trial, then add Dory to your team's Discord. It works at once with no setup."},
  "en1_b": {"th": "สร้างบัญชีและเริ่มใช้ →", "en": "Create an account and start →"},
  "en2_t": {"th": "องค์กรหลายทีม", "en": "Organizations with many teams"},
  "en2_d": {"th": "รวมหลายเซิร์ฟเวอร์และ workspace ไว้ในองค์กรเดียว จัดการสมาชิก คลังเอกสาร แพ็กเกจ และคุยกับดอรี่จากเว็บ", "en": "Bring several servers and workspaces under one organization: members, document library, plan, and chat with Dory from the web."},
  "en2_b": {"th": "เปิดศูนย์ควบคุมองค์กร →", "en": "Open the organization center →"},
  "en3_t": {"th": "ประชุมบน Google Meet", "en": "Meetings on Google Meet"},
  "en3_d": {"th": "เปิดเครื่องอัดคู่กับ Google Meet ถอดเสียงภาษาไทยสด แล้วสรุปมติและงานที่ต้องทำส่งเข้า Discord", "en": "Open the recorder beside Google Meet for a live Thai transcript, then decisions and action items posted to Discord."},
  "en3_b": {"th": "เปิดเครื่องอัดประชุม →", "en": "Open the meeting recorder →"},
  "foot_copy": {"th": "© 2026 The Frontier Company Limited", "en": "© 2026 The Frontier Company Limited"},
  "foot_privacy": {"th": "ความเป็นส่วนตัว", "en": "Privacy"},
  "foot_terms": {"th": "ข้อกำหนดการใช้งาน", "en": "Terms"},
  "foot_recorder": {"th": "เครื่องอัดประชุม Meeting Scribe", "en": "Meeting Scribe recorder"}
}
</script>
<script>
"use strict";
document.documentElement.classList.add("js"); // reveal hides content only when this script runs

// ---------- language (Thai / English) ----------
// Priority: saved manual choice ("dory-language") -> English. The browser language is not consulted.
const LANG_KEY = "dory-language";
const SUPPORTED = ["th", "en"];
const $ = (id) => document.getElementById(id);
const I18N = JSON.parse($("i18n-data").textContent);
function readLang(op, v) {
  try {
    if (op === "set") { localStorage.setItem(LANG_KEY, v); return null; }
    const s = localStorage.getItem(LANG_KEY);
    return SUPPORTED.includes(s) ? s : null;
  } catch { return null; } // storage blocked: the choice then lasts until reload
}
let lang = readLang("get") || "en";
function t(key) { const e = I18N[key]; return e ? (e[lang] ?? e.en) : key; }
function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("title");
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-attr]")) {
    for (const pair of el.dataset.i18nAttr.split(";")) { const [attr, key] = pair.split(":"); el.setAttribute(attr, t(key)); }
  }
  for (const el of document.querySelectorAll("[data-lang]")) el.setAttribute("aria-pressed", String(el.dataset.lang === lang));
  $("lang-other").lang = lang === "th" ? "en" : "th";
  markInvite();
  paintMotion();
  pvButton();
}
function setLang(l) { if (!SUPPORTED.includes(l)) return; lang = l; readLang("set", l); applyStatic(); }
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => setLang(b.dataset.lang));
$("lang-other").addEventListener("click", () => setLang(lang === "th" ? "en" : "th"));

// The invite URL is filled in by the server from DORY_DISCORD_CLIENT_ID. Never fabricate one: with
// no client id the invite buttons hide and "Create account" takes the primary place instead.
function markInvite() {
  let ok = false;
  for (const a of document.querySelectorAll("[data-invite]")) {
    ok = a.getAttribute("href").startsWith("https://discord.com/");
    a.hidden = !ok;
    if (ok) { a.target = "_blank"; a.rel = "noopener"; }
  }
  for (const a of document.querySelectorAll("[data-invite-fallback]")) a.hidden = ok;
  for (const a of document.querySelectorAll("[data-invite-aside]")) a.hidden = !ok;
  for (const a of document.querySelectorAll("[data-invite-alt]")) { a.classList.toggle("primary", !ok); a.classList.toggle("ghost", ok); }
}

// The server fills the model list; an empty list (or a page opened without the server) hides the line.
const models = $("models");
if (!models.textContent.trim() || models.textContent.startsWith("__")) $("models-line").hidden = true;

// ---------- navigation ----------
const nav = $("nav"), links = $("links"), menu = $("menu");
const onScroll = () => nav.classList.toggle("scrolled", scrollY > 8);
addEventListener("scroll", onScroll, { passive: true });
onScroll();
function closeMenu() { links.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); }
menu.addEventListener("click", () => menu.setAttribute("aria-expanded", String(links.classList.toggle("open"))));
links.addEventListener("click", (e) => { if (e.target.tagName === "A") closeMenu(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && links.classList.contains("open")) { closeMenu(); menu.focus(); } });

// ---------- motion: one switch, remembered; the OS "reduce motion" setting always wins ----------
const MOTION_KEY = "dory-motion";
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
function savedMotion(v) {
  try { if (v) localStorage.setItem(MOTION_KEY, v); return localStorage.getItem(MOTION_KEY); } catch { return null; }
}
let motionOn = !reduce.matches && savedMotion() !== "off";
const hero = $("hero"), stage = $("stage"), fish = $("fish");
let heroVisible = true;
const awake = () => motionOn && heroVisible && !document.hidden;
function paintMotion() {
  document.documentElement.classList.toggle("motion-off", !motionOn);
  for (const b of document.querySelectorAll("[data-motion-toggle]")) {
    b.hidden = reduce.matches; // nothing moves, so there is nothing to pause
    b.querySelector("span").textContent = t(motionOn ? "pause" : "play");
  }
}
function setMotion(on) {
  motionOn = on; savedMotion(on ? "on" : "off"); paintMotion();
  if (on) { wake(); pvPlay(); } else { rest(true); pvShowAll(); }
}
for (const b of document.querySelectorAll("[data-motion-toggle]")) b.addEventListener("click", () => setMotion(!motionOn));
reduce.addEventListener("change", () => { motionOn = !reduce.matches && savedMotion() !== "off"; paintMotion(); if (!motionOn) rest(true); });

// ---------- hero: Dory turns toward the pointer (M1) and the sea moves in depth (M2) ----------
const cur = { tilt: 0, px: 0, py: 0 }, tgt = { ...cur };
let raf = 0;
const clamp = (v) => Math.max(-1, Math.min(1, v));
function paint() {
  stage.style.setProperty("--tilt", cur.tilt.toFixed(2));
  hero.style.setProperty("--px", cur.px.toFixed(3));
  hero.style.setProperty("--py", cur.py.toFixed(3));
}
function frame() {
  raf = 0;
  let moving = false;
  for (const k in cur) {
    const d = tgt[k] - cur[k];
    if (Math.abs(d) > .002) { cur[k] += d * (k === "px" || k === "py" ? .08 : .12); moving = true; } else cur[k] = tgt[k];
  }
  paint();
  if (moving) wake(); // the loop stops itself once everything has settled
}
function wake() { if (!raf && awake()) raf = requestAnimationFrame(frame); }
function aim(x, y) {
  const r = fish.getBoundingClientRect();
  const dy = y - (r.top + r.height * .48); // her eyes
  Object.assign(tgt, { tilt: clamp(dy / 400) * 6, px: clamp(x / innerWidth * 2 - 1), py: clamp(y / innerHeight * 2 - 1) });
  wake();
}
function rest(now) {
  for (const k in tgt) tgt[k] = 0;
  if (now) { Object.assign(cur, tgt); paint(); hero.style.setProperty("--sy", "0"); } else wake();
}
let tapT = 0;
hero.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") aim(e.clientX, e.clientY); }, { passive: true });
hero.addEventListener("pointerleave", () => rest(false));
hero.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse") return;
  aim(e.clientX, e.clientY); clearTimeout(tapT); tapT = setTimeout(() => rest(false), 1200); // a tap: look there, then back
}, { passive: true });
let sraf = 0;
addEventListener("scroll", () => {
  if (!sraf && awake()) sraf = requestAnimationFrame(() => { sraf = 0; hero.style.setProperty("--sy", String(Math.round(scrollY))); });
}, { passive: true });
new IntersectionObserver(([e]) => {
  heroVisible = e.isIntersecting;
  hero.classList.toggle("asleep", !heroVisible);
  if (heroVisible) wake();
}).observe(hero);
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });

// drifting specks (decorative, <= 24): placed from a fixed sequence, so every visit looks the same
const specks = $("specks");
for (let i = 0; i < 20; i++) {
  const r = (n) => { const v = Math.sin(i * 12.9898 + n * 78.233) * 43758.5453; return v - Math.floor(v); };
  const s = document.createElement("i");
  s.className = "speck";
  s.style.cssText = `--x:${(r(1) * 100).toFixed(1)}%;--y:${(25 + r(2) * 70).toFixed(1)}%;--s:${(1.5 + r(3) * 2.5).toFixed(1)}px;` +
    `--o:${(.2 + r(4) * .45).toFixed(2)};--d:${(14 + r(5) * 16).toFixed(1)}s;--dl:-${(r(6) * 20).toFixed(1)}s`;
  specks.append(s);
}

// ---------- reveal on entering view (M7), once ----------
const seen = new IntersectionObserver((es) => {
  for (const e of es) if (e.isIntersecting) { e.target.classList.add("in"); seen.unobserve(e.target); }
}, { rootMargin: "0px 0px -8% 0px", threshold: .08 });
for (const el of document.querySelectorAll(".reveal")) seen.observe(el);

// ---------- ARIA tabs (preview and roles): arrows, Home and End move; selection follows focus ----------
function tabs(list, onSelect) {
  const ts = [...list.querySelectorAll('[role="tab"]')];
  const select = (tab, focus) => {
    for (const x of ts) {
      const on = x === tab;
      x.setAttribute("aria-selected", String(on)); x.tabIndex = on ? 0 : -1;
      $(x.getAttribute("aria-controls")).hidden = !on;
    }
    if (focus) tab.focus();
    if (onSelect) onSelect($(tab.getAttribute("aria-controls")));
  };
  list.addEventListener("click", (e) => { const tb = e.target.closest('[role="tab"]'); if (tb) select(tb); });
  list.addEventListener("keydown", (e) => {
    const i = ts.indexOf(document.activeElement);
    if (i < 0) return;
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (step) { e.preventDefault(); select(ts[(i + step + ts.length) % ts.length], true); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); select(ts.at(e.key === "Home" ? 0 : -1), true); }
  });
}

// ---------- "See Dory at work": each example plays once in view; Replay and Pause; final state without motion ----------
const pv = { panel: $("pvp1"), steps: [], i: 0, timer: 0, paused: false, thinking: false };
function think(on) {
  const p = pv.panel;
  p.querySelector(".think").hidden = !on;
  p.querySelector(".st").textContent = t(on ? "st_thinking" : "st_ready");
  p.querySelector(".chat-h .lantern").classList.toggle("pulse", on);
}
function pvButton() {
  const b = $("pv-pause"), done = pv.i >= pv.steps.length;
  b.textContent = t(pv.paused ? "pv_play" : "pv_pause");
  b.hidden = !motionOn; // without motion every example is shown whole: nothing to pause
  b.disabled = done;
}
function pvShowAll() {
  clearTimeout(pv.timer);
  for (const s of pv.steps) s.classList.remove("pending");
  pv.i = pv.steps.length; pv.paused = false; pv.thinking = false; think(false); pvButton();
}
function pvNext() {
  if (pv.paused) return;
  if (pv.i >= pv.steps.length) { think(false); pvButton(); return; }
  const s = pv.steps[pv.i], dory = s.classList.contains("m-dory");
  if (dory && !pv.thinking) { pv.thinking = true; think(true); pv.timer = setTimeout(pvNext, 1100); return; }
  pv.thinking = false; think(false); s.classList.remove("pending"); s.classList.add("shown"); pv.i++;
  pv.timer = setTimeout(pvNext, dory ? 900 : 500);
  pvButton();
}
function pvPlay() {
  clearTimeout(pv.timer);
  pv.steps = [...pv.panel.querySelectorAll(".step")]; pv.i = 0; pv.paused = false; pv.thinking = false;
  if (!motionOn) { pvShowAll(); return; }
  for (const s of pv.steps) { s.classList.add("pending"); s.classList.remove("shown"); }
  think(false); pvButton();
  pv.timer = setTimeout(pvNext, 300);
}
tabs($("pv-tabs"), (panel) => { clearTimeout(pv.timer); think(false); pv.panel = panel; pvPlay(); });
tabs($("ro-tabs"));
$("pv-replay").addEventListener("click", pvPlay);
$("pv-pause").addEventListener("click", () => { pv.paused = !pv.paused; if (pv.paused) clearTimeout(pv.timer); else pvNext(); pvButton(); });
pv.steps = [...pv.panel.querySelectorAll(".step")]; pv.i = pv.steps.length; // complete until it scrolls into view
const pvSeen = new IntersectionObserver(([e]) => { if (e.isIntersecting) { pvSeen.disconnect(); pvPlay(); } }, { threshold: .35 });
pvSeen.observe($("preview"));

applyStatic();
</script>
</body>
