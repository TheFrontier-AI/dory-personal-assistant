      <stop offset="0" stop-color="#6A9BF5"/>
      <stop offset=".5" stop-color="#B9B4F2"/>
      <stop offset="1" stop-color="#FFDDB8"/>
    </linearGradient>
    <linearGradient id="df-dorsal" x1="0" y1="1" x2=".3" y2="0">
      <stop offset="0" stop-color="#5B8DF2"/>
      <stop offset=".55" stop-color="#B9B4F2"/>
      <stop offset="1" stop-color="#FFE4C8"/>
    </linearGradient>
    <linearGradient id="df-side" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#C9C4F7"/>
      <stop offset="1" stop-color="#FFE0C2"/>
