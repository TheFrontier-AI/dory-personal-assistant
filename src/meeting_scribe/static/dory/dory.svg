        <circle cx="86" cy="96" r="2.2"/><circle cx="102" cy="86" r="2.4"/><circle cx="119" cy="77" r="2.6"/><circle cx="136" cy="70" r="2.6"/><circle cx="153" cy="65" r="2.4"/><circle cx="170" cy="62" r="2.1"/>
      </g>
