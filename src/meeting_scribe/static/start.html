<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your Dory account</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<link rel="icon" type="image/png" href="/static/dory/favicon.png">
<link rel="apple-touch-icon" href="/static/dory/apple-touch-icon.png">
<link rel="stylesheet" href="/static/dory/theme.css">
<script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>
<style>
  /* Page-specific rules only: tokens, base, .nav/.logo/.mark, .btn, forms and notices come from theme.css. */
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .nav { position: static; background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .logo .mark { box-shadow: none; }
  .who { font-size: 14px; color: var(--color-text-muted); overflow-wrap: anywhere; }
  main { flex: 1; padding: 16px 0 72px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 500px); gap: 32px 64px; align-items: start; }
  .flow { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; }
  .steps span { flex: 1 1 96px; display: flex; align-items: center; gap: 8px; padding-top: 10px; font-size: 14px; color: var(--color-text-muted); border-top: 3px solid var(--color-border); }
  .steps em { font-style: normal; }
  .steps i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--color-bg-sunken); color: var(--color-text-muted); }
  .steps span.on { color: var(--color-text); font-weight: 600; border-top-color: var(--color-action); }
  .steps span.on i { background: var(--color-action); color: var(--color-on-action); }
  .steps span.done { color: var(--color-text); border-top-color: var(--color-action); }
  .steps span.done i { color: var(--color-action); }
  /* each step is open content on the page, not a boxed card */
  .card { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none; }
  .card > * { max-width: 100%; }
  .card h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 5.4vw, 72px); line-height: 1.04; letter-spacing: -.02em; max-width: 12ch; }
  .card h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.15; letter-spacing: -.01em; }
  :lang(th) .card h1, :lang(th) .card h2 { line-height: 1.35; letter-spacing: 0; }
  .card p { font-size: 17px; max-width: 60ch; color: var(--color-text); }
  .card p.lead { font-size: 19px; }
  .card p.fine { font-size: 15px; color: var(--color-text-muted); }
  ul.gets { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; max-width: 60ch; }
  ul.gets li { display: flex; gap: 12px; align-items: flex-start; font-size: 17px; }
  ul.gets svg { width: 20px; height: 20px; flex: none; color: var(--color-action); margin-top: 4px; }
  ul.gets b { font-weight: 600; }
  #gsi-button { min-height: 44px; display: flex; }
  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; width: 100%; max-width: 480px; }
  .plan { border: 2px solid var(--color-border-control); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--color-bg-raised); color: var(--color-text); text-align: left; }
  .plan[aria-pressed="true"] { border-color: var(--color-action); }
  .plan b { font-size: 17px; }
  .plan span { font-size: 14px; color: var(--color-text-muted); }
  .plan .price { font-size: 15px; font-weight: 600; color: var(--color-action); }
  .plan .pill { align-self: flex-start; font-size: 12px; color: var(--color-action); }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; width: 100%; max-width: 480px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn.primary, .btn.primary:hover, .btn.primary:active { box-shadow: none; }
  ol.how { margin: 0; padding-left: 22px; display: grid; gap: 10px; font-size: 17px; max-width: 60ch; }
  ol.how code { font-family: var(--mono); font-size: 14px; background: var(--color-bg-sunken); color: var(--color-text); padding: 2px 7px; border-radius: 6px; }
  /* Dory's picture keeps the person company through every step */
  .hero-pic { margin: 0; position: sticky; top: 24px; }
  .hero-pic img { display: block; width: 100%; height: auto; aspect-ratio: 777 / 779; object-fit: cover; border-radius: var(--radius-xl); background: var(--ocean-800); }
  footer { padding: 24px 0 40px; color: var(--color-text-muted); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; }
  footer a { color: var(--color-text-muted); }
  footer a:hover { color: var(--color-text); }
  /* motion: each step rises in when it opens; Dory floats. Transform and opacity only. */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes buoy { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .card > * { animation: rise var(--dur-slow) var(--ease) both; }
  .card > :nth-child(2) { animation-delay: 60ms; } .card > :nth-child(3) { animation-delay: 120ms; }
  .card > :nth-child(4) { animation-delay: 180ms; } .card > :nth-child(n+5) { animation-delay: 240ms; }
  .hero-pic { animation: rise var(--dur-gentle) var(--ease) 120ms both; }
  .hero-pic img { animation: buoy 6s var(--ease-in-out) 1s infinite; }
  @media (prefers-reduced-motion: reduce) { .card > *, .hero-pic, .hero-pic img { animation: none; } }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .flow { gap: 28px; }
    .hero-pic { order: -1; position: static; width: min(176px, 46%); }
    .hero-pic img { border-radius: var(--radius-lg); }
  }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Dory"><span class="mark" aria-hidden="true">D</span><span data-i18n="brand"></span></a>
    <div class="grow"></div>
    <span class="who" id="who" hidden></span>
    <div class="langsw" role="group" data-i18n-attr="aria-label:lang_switch_aria">
      <button type="button" data-lang="th" data-i18n="lang_th"></button>
      <button type="button" data-lang="en" data-i18n="lang_en"></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap layout">
    <div class="flow">
    <div class="steps" id="steps" aria-hidden="true" hidden>
      <span data-step="1" class="on"><i>1</i><em data-i18n="s1"></em></span>
      <span data-step="2"><i>2</i><em data-i18n="s2"></em></span>
      <span data-step="3"><i>3</i><em data-i18n="s3"></em></span>
      <span data-step="4"><i>4</i><em data-i18n="s4"></em></span>
    </div>

    <!-- step 1: welcome + Google sign-in -->
    <section class="card" id="step1">
      <h1 data-i18n="w_h"></h1>
      <p class="lead" data-i18n="w_p"></p>
      <ul class="gets">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><div><b data-i18n="g1_t"></b> <span data-i18n="g1_d"></span></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><div><b data-i18n="g2_t"></b> <span data-i18n="g2_d"></span></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><div><b data-i18n="g3_t"></b> <span data-i18n="g3_d"></span></div></li>
      </ul>
      <p data-i18n="w_next"></p>
      <div id="gsi-button"></div>
      <button type="button" class="btn ghost" id="discord-signup" data-i18n="signup_discord" hidden></button>
      <div class="notice" id="not-configured" data-i18n="not_configured" hidden></div>
      <div class="notice error" id="login-error" hidden></div>
      <p class="fine" data-i18n="w_privacy"></p>
    </section>

    <!-- already a member -->
    <section class="card" id="existing" hidden>
      <h2 data-i18n="ex_h"></h2>
      <p data-i18n="ex_p"></p>
      <div class="row"><a class="btn primary" href="/center" data-i18n="go_center"></a><button type="button" class="btn ghost" id="another" data-i18n="ex_new"></button></div>
    </section>

    <!-- step 2: plan -->
    <section class="card" id="step2" hidden>
      <h2 data-i18n="p_h"></h2>
      <p data-i18n="p_p"></p>
      <div class="plans" role="group" data-i18n-attr="aria-label:p_h">
        <button type="button" class="plan" data-plan="trial" aria-pressed="true"><span class="pill" data-i18n="p_rec"></span><b data-i18n="pl_trial"></b><span class="price" data-i18n="pl_trial_price"></span><span data-i18n="pl_trial_d"></span></button>
      </div>
      <div class="notice" data-i18n="p_note"></div>
      <div class="row"><button type="button" class="btn primary" id="to3" data-i18n="next"></button></div>
    </section>

    <!-- step 3: organization -->
    <section class="card" id="step3" hidden>
      <h2 data-i18n="o_h"></h2>
      <p data-i18n="o_p"></p>
      <label><span data-i18n="o_label"></span><input type="text" id="org-name" maxlength="120" autocomplete="organization" data-i18n-attr="placeholder:o_ph"></label>
      <div class="notice error" id="org-error" hidden></div>
      <div class="row"><button type="button" class="btn primary" id="create" data-i18n="o_btn"></button><button type="button" class="btn ghost" id="back2" data-i18n="back"></button></div>
    </section>

    <!-- step 4: connect Discord -->
    <section class="card" id="step4" hidden>
      <div class="notice ok" id="created-note"></div>
      <h2 data-i18n="c_h"></h2>
      <p data-i18n="c_p"></p>
      <ol class="how">
        <li data-i18n-html="c1"></li>
        <li data-i18n-html="c2"></li>
        <li data-i18n-html="c3"></li>
      </ol>
      <div class="notice" id="invite-soon" data-i18n="invite_soon" hidden></div>
      <div class="row">
        <a class="btn primary" href="__DORY_INVITE_URL__" data-invite></a>
        <a class="btn ghost" href="/center" data-i18n="go_center"></a>
      </div>
      <p class="fine" data-i18n="c_later"></p>
    </section>
    </div>
    <picture class="hero-pic">
      <source srcset="/static/dory/dory.webp" type="image/webp">
      <img src="/static/dory/dory.jpg" width="777" height="779" alt="" decoding="async" fetchpriority="high" data-i18n-attr="alt:hero_alt">
    </picture>
  </div>
</main>

<footer>
  <div class="wrap"><span data-i18n="foot_copy"></span><a href="/" data-i18n="foot_home"></a><a href="/center" data-i18n="go_center"></a></div>
</footer>

<script>
// ---------- language: shared key with the landing page ----------
const LANG_KEY = "dory-language", SUPPORTED = ["th", "en"];
const $ = (id) => document.getElementById(id);
const I18N = JSON.parse($("i18n-data").textContent);
function readLang(op, v) {
  try {
    if (op === "set") { localStorage.setItem(LANG_KEY, v); return null; }
    const s = localStorage.getItem(LANG_KEY); return SUPPORTED.includes(s) ? s : null;
  } catch { return null; }
}
// English by default for everyone; a saved choice (shared with the landing page) wins.
let lang = readLang("get") || "en";
function t(key, params) {
  const e = I18N[key]; let s = e ? (e[lang] ?? e.en) : key;
  if (params) for (const [k, v] of Object.entries(params)) s = s.split("{" + k + "}").join(String(v));
  return s;
}
function applyStatic() {
  document.documentElement.lang = lang; document.title = t("title");
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n, el._p);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-attr]")) for (const pair of el.dataset.i18nAttr.split(";")) { const [a, k] = pair.split(":"); el.setAttribute(a, t(k)); }
  for (const el of document.querySelectorAll("[data-lang]")) el.setAttribute("aria-pressed", String(el.dataset.lang === lang));
  for (const el of document.querySelectorAll(".notice")) if (el._f) el.textContent = el._f();
  markInvite();
  if (!$("step1").hidden) renderGoogleButton();
}
function setLang(l, { remember = true } = {}) {
  if (!SUPPORTED.includes(l)) return; lang = l; readLang("set", l); applyStatic();
  // signed in: remember the choice with the account (shared with /hub and /center)
  if (remember && token) api("/me/language", { method: "PUT", body: JSON.stringify({ language: l }) }).catch(() => {});
}
function syncLang(saved) {
  if (SUPPORTED.includes(saved)) { if (saved !== lang) setLang(saved, { remember: false }); }
  else if (readLang("get")) api("/me/language", { method: "PUT", body: JSON.stringify({ language: lang }) }).catch(() => {});
}
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => setLang(b.dataset.lang));
function note(el, fn) { el._f = fn; el.textContent = fn ? fn() : ""; el.hidden = !el.textContent; }
function markInvite() {
  for (const a of document.querySelectorAll("[data-invite]")) {
    const ok = a.getAttribute("href").startsWith("https://discord.com/");
    a.setAttribute("aria-disabled", String(!ok));
    a.hidden = !ok;
    if (ok) { a.target = "_blank"; a.rel = "noopener"; a.textContent = t("cta_add"); } else { a.removeAttribute("target"); a.textContent = t("cta_unconfigured"); }
    $("invite-soon").hidden = ok; // the public page never shows an internal variable name
  }
}

// ---------- flow ----------
const CLIENT_ID = "__HUB_GOOGLE_CLIENT_ID__";
const DISCORD_LOGIN = "__DISCORD_LOGIN__" === "1";
const API = "/api/center";
let token = "", gsiReady = false, me = null;
// ---------- Dory session: sign in once, stay signed in (30 days, every page, survives reloads) ----------
const SESSION_KEY = "dory_session";
function session(op, v) {
  try {
    if (op === "set") localStorage.setItem(SESSION_KEY, v);
    else if (op === "clear") localStorage.removeItem(SESSION_KEY);
    else { const s = localStorage.getItem(SESSION_KEY); return s && s.startsWith("ss1.") ? s : null; }
  } catch { /* storage blocked: the sign-in then lasts until reload */ }
  return null;
}
// Exchange a fresh Google sign-in for a Dory session (null when the server has no session secret).
async function exchangeSession(googleCredential) {
  try {
    const r = await fetch("/api/hub/session", { method: "POST", headers: { Authorization: "Bearer " + googleCredential } });
    if (!r.ok) return null;
    const j = await r.json(); session("set", j.token); return j.token;
  } catch { return null; }
}
function show(step) {
  for (const id of ["step1", "existing", "step2", "step3", "step4"]) $(id).hidden = id !== step;
  const n = { step1: 1, existing: 1, step2: 2, step3: 3, step4: 4 }[step];
  $("steps").hidden = n === 1; // the welcome screen names the steps in words; the bar shows from step 2
  for (const s of document.querySelectorAll("[data-step]")) {
    const k = Number(s.dataset.step); s.classList.toggle("on", k === n); s.classList.toggle("done", k < n);
  }
  window.scrollTo({ top: 0 });
}
async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...(opts.body ? { "Content-Type": "application/json" } : {}), Authorization: "Bearer " + token } });
  if (!res.ok) { const err = new Error("api"); err.status = res.status; throw err; }
  return res.json();
}
function renderGoogleButton() {
  if (!CLIENT_ID) { $("not-configured").hidden = false; return; }
  if (!window.google || !google.accounts) { setTimeout(renderGoogleButton, 200); return; }
  if (!gsiReady) { google.accounts.id.initialize({ client_id: CLIENT_ID, callback: async (r) => { token = r.credential; const s = await exchangeSession(token); if (s) token = s; signedIn(); } }); gsiReady = true; }
  $("gsi-button").replaceChildren();
  google.accounts.id.renderButton($("gsi-button"), { theme: "outline", size: "large", text: "signup_with", locale: lang, width: 300 });
}
async function signedIn() {
  try { me = await api("/me"); }
  catch (e) { note($("login-error"), () => t("login_failed", { status: e.status || "network" })); token = ""; return; }
  syncLang(me.language);
  $("who").textContent = me.email; $("who").hidden = false;
  show(me.orgs.length ? "existing" : "step2");
}
$("another").addEventListener("click", () => show("step2"));
$("to3").addEventListener("click", () => { show("step3"); $("org-name").focus(); });
$("back2").addEventListener("click", () => show("step2"));
$("create").addEventListener("click", async () => {
  const name = $("org-name").value.trim();
  if (!name) { note($("org-error"), () => t("o_empty")); return; }
  $("create").disabled = true; note($("org-error"), null);
  try {
    // Launch: the only plan is the open-ended trial (POST /orgs grants it); nothing is charged.
    const org = await api("/orgs", { method: "POST", body: JSON.stringify({ name }) });
    note($("created-note"), () => t("created", { name, plan: t("pl_" + (org.license && org.license.plan || "trial")) }));
    show("step4");
  } catch (e) {
    note($("org-error"), () => t(e.status === 409 ? "o_too_many" : "o_failed", { status: e.status || "network" }));
  } finally { $("create").disabled = false; }
});
$("org-name").addEventListener("keydown", (e) => { if (e.key === "Enter") $("create").click(); });
// The homepage hands over the company name as ?org=: prefill step 3 (trimmed, within the field's limit). The tab keeps
// it in sessionStorage, so the round trip through "Sign up with Discord" does not lose it.
const ORG_KEY = "dory_signup_org";
try {
  const org = (new URLSearchParams(location.search).get("org") || "").trim().slice(0, $("org-name").maxLength);
  $("org-name").value = org || sessionStorage.getItem(ORG_KEY) || "";
  if (org) sessionStorage.setItem(ORG_KEY, org);
} catch { /* storage blocked: only this page load keeps the name */ }
// Hand the credential to /center (same tab, sessionStorage, read once there) so the user is not
// asked to sign in again right after signing up.
function tokenExp(tok) {
  try { return Number(JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp) || 0; } catch { return 0; }
}
for (const a of document.querySelectorAll('a[href="/center"]')) a.addEventListener("click", () => {
  if (!token) return;
  try { sessionStorage.setItem("dory_center_handoff", JSON.stringify({ t: token, exp: tokenExp(token) })); } catch { /* then /center asks once */ }
});
applyStatic();
// Back from "Sign up with Discord": the session arrives in the fragment.
try {
  const m = /^#session=(ss1\.[A-Za-z0-9_.-]+)$/.exec(location.hash);
  if (m) { session("set", m[1]); history.replaceState(null, "", location.pathname); }
  const u = new URLSearchParams(location.search);
  if (u.get("error") && u.get("platform") === "discord") {
    const er = u.get("error"); note($("login-error"), () => er === "discord_no_email" ? t("discord_no_email") : t("login_failed", { status: er }));
    history.replaceState(null, "", location.pathname);
  }
} catch { /* ignore */ }
$("discord-signup").hidden = !DISCORD_LOGIN;
$("discord-signup").addEventListener("click", () => { location.href = "/api/center/auth/discord/start?next=start"; });
if (session("get")) { token = session("get"); signedIn(); } // already signed in on another page: skip the Google step
</script>
</body>
</html>
